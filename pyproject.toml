[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mrgym"
version = "0.1.0.dev0"
description = "MR Gym: a virtual MRI scanner you can drop an AI agent into"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ke Wang" }]
keywords = [
    "MRI", "magnetic resonance", "virtual scanner", "simulation", "Bloch", "EPG",
    "reinforcement learning", "environment", "LLM agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
]
# The core is the scanner, its physics, the environments, the recorder, the viewer and the model runner. It needs
# numpy and scipy and nothing else: no web framework (the service uses http.server), no agent framework, no model
# SDK (the runner speaks the OpenAI-compatible chat API over urllib). Adapters live under integrations/.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Figures (tools/figures, the results plot). The episode viewer does not need it.
viz = ["matplotlib>=3.7"]
# Adapters. `mrgym.compat.gymnasium` needs gymnasium; `integrations/inspect/` needs inspect-ai. The versions are the ones
# the adapters were run with (see integrations/README.md). Neither is part of `all`.
gymnasium = ["gymnasium>=1.4"]
inspect = ["inspect-ai>=0.3.292; python_version >= '3.11'"]      # inspect-ai needs Python 3.11
all = ["mrgym[viz]"]

[project.scripts]
mrgym = "mrgym.cli:main"

[project.urls]
Homepage = "https://github.com/KeWang0622/MRGym"
"Companion skill library" = "https://github.com/KeWang0622/MRFoundry"
"Held-out evaluation" = "https://github.com/KeWang0622/MRIAgentBench"
Repository = "https://github.com/KeWang0622/MRGym"
Issues = "https://github.com/KeWang0622/MRGym/issues"
Changelog = "https://github.com/KeWang0622/MRGym/blob/main/CHANGELOG.md"

# Development dependencies are PEP 735 groups, not extras: they never reach a user's install.
#   uv sync --group dev          or          pip install -e . --group dev      (pip >= 25.1)
[dependency-groups]
test = ["pytest>=8"]
lint = ["ruff>=0.15"]
build = ["build>=1.2", "twine>=6.1"]
# what `make audit` needs (tools/ci/requirements-audit.txt pins the versions of the last audit)
audit = [
    "pytest>=8", "ruff>=0.15", "hypothesis>=6.100", "hypothesis-jsonschema>=0.23", "mutmut>=3.8,<4", "coverage>=7.6",
    "mypy>=1.13", "build>=1.2", "twine>=6.1", "check-wheel-contents>=0.6", "threadpoolctl>=3.5",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "build" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/mrgym"]       # includes the package data: scanner/datasheet.md, envs/results/*.json, viewer template

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/envs",
    "/examples",
    "/results",
    "/tools",
    "/integrations",
    "/datasets",
    "/conformance",
    "/extras",
    "/assets",
    "/AGENTS.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/CONTRIBUTING.md",
    "/DATASHEET.md",
    "/Makefile",
    "/SECURITY.md",
    "/.pre-commit-config.yaml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]          # for the shared helpers in tests/conftest.py; never the repository root or src
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = ["error::DeprecationWarning:mrgym.*"]
markers = [
    "hard_pulse: a metamorphic relation that assumes an instantaneous excitation (re-derive it when the engine gets a slice profile)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["extras"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import order
    "B",    # bugbear
    "UP",   # pyupgrade
    "NPY",  # numpy legacy API (random state, deprecated aliases)
]
ignore = [
    "E501",  # line length is handled by the formatter where it matters; physics formulas stay on one line
    "E702",  # short `a; b` statements in command-line parsers
    "E741",  # single-letter names follow the physics notation
    "B905",  # zip(strict=) is not wanted where lengths are equal by construction
]

[tool.ruff.lint.isort]
known-first-party = ["mrgym"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B023"]
"extras/*" = ["E", "F", "W", "I", "B", "UP", "NPY"]

# ---- mutation gate (tools/audit/mutation.py; `make mutation`). Scope: the code that decides a reward or a gate verdict.
# mutmut mutates code inside functions only: module-level constants are pinned by tests/golden/scoring_constants.json
# and by tools/audit/hand_mutants.py.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/mrgym/envs/family.py",
    "src/mrgym/gate.py",
    "src/mrgym/envs/*/task.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_family_contract.py",
    "tests/test_gate.py",
    "tests/test_scoring_table.py",
    "tests/test_null_tissue.py",
    "tests/test_task_snapshots.py",
]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
also_copy = ["tests/"]

# ---- coverage (make coverage): total >= 90 %, the scoring scope >= 95 %
[tool.coverage.run]
source = ["mrgym"]
parallel = true
concurrency = ["multiprocessing"]
patch = ["subprocess"]
sigterm = true                     # a service a test stops with terminate() still writes its data

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

# ---- types (python tools/audit/typecheck.py): the public surface and the scoring code, against a ratchet baseline
[tool.mypy]
python_version = "3.10"
files = [
    "src/mrgym/env.py", "src/mrgym/tools.py", "src/mrgym/registry.py", "src/mrgym/gate.py", "src/mrgym/keys.py",
    "src/mrgym/envs/family.py", "src/mrgym/envs/null_tissue/task.py",
]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# ---- wheel contents (check-wheel-contents dist/*.whl)
[tool.check-wheel-contents]
toplevel = ["mrgym"]
package = ["src/mrgym"]
