services:
  main:
    depends_on:
      scanner:
        condition: service_healthy
  scanner:
    build:
      context: ./scanner
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s
