# The CI matrix of MR Gym. This file lives under tools/ci/ because the repository's push token cannot write
# .github/workflows/ (no `workflow` scope). To activate it the owner copies it once, see tools/ci/README.md:
#     cp tools/ci/tests.yml .github/workflows/tests.yml
# Every action is pinned to a commit (the tag is in the comment); the token is read-only; no secret is used.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"          # nightly: the fuzz job only

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # a scan is single-threaded work; one thread also keeps the numbers the same from run to run
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  lint:
    name: Lint and types
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . -r tools/ci/requirements-audit.txt "zizmor"
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Types (the scope of [tool.mypy] in pyproject.toml, against the stored baseline)
        run: python tools/audit/typecheck.py
      - name: Workflow lint
        run: zizmor .github/workflows

  test:
    name: Tests (Python ${{ matrix.python }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel
        run: |
          python -m pip install "build>=1.2"
          python -m build --wheel
      # The tests run against the installed wheel, never the working tree (src layout, no editable install).
      # Hypothesis is installed where it supports the interpreter; the contract machine is skipped elsewhere.
      - name: Install the wheel
        run: |
          python -m pip install dist/*.whl "pytest>=8"
          python -m pip install hypothesis hypothesis-jsonschema || echo "no Hypothesis on this interpreter: the contract machine is skipped"
      - name: Where the package comes from
        run: |
          python - <<'PY'
          import os, sys
          import mrgym, numpy, scipy
          print(mrgym.__file__)
          print("numpy", numpy.__version__, "scipy", scipy.__version__)
          here = os.path.realpath(os.getcwd()) + os.sep
          sys.exit(os.path.realpath(mrgym.__file__).startswith(here + "src" + os.sep))
          PY
      - name: Tests
        run: python -m pytest -W "error::DeprecationWarning:mrgym"
      - name: Version
        run: mrgym --version
      - name: Environments
        run: mrgym list
      - name: One episode
        run: mrgym demo
      - name: Physics checks
        run: mrgym validate
      - name: Generated files are current
        run: python tools/generate.py --check
      - name: The results archive is the table of its results.json
        run: mrgym results --check --dir docs/results

  test-os:
    name: Tests (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: python -m pip install . "pytest>=8" hypothesis hypothesis-jsonschema
      # another machine and BLAS: the golden digests are compared in tolerance mode (the header of the run says so)
      - name: Tests
        shell: bash
        run: python -m pytest -W "error::DeprecationWarning:mrgym"

  lowest:
    name: Lowest declared numpy and scipy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install with the lowest direct dependencies
        run: |
          python -m pip install uv
          uv pip install --system --resolution lowest-direct . "pytest>=8"
      - name: Tests
        run: python -m pytest

  reference-stack:
    name: Golden digests, bit for bit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # the numpy / scipy the digests in tests/golden/engine_digests.json were recorded on
      - name: Install the reference stack
        run: python -m pip install . "numpy==2.2.6" "scipy==1.15.3" "pytest>=8"
      # Forced bit-exact: with these versions every digest must be reproduced. If the runner's CPU gives other last
      # bits than the machine the file was recorded on, this job says so on its first run; record the file on the
      # runner then (python tools/audit/golden.py --write --new-reference-stack) and commit it.
      - name: Golden digests
        env:
          MRGYM_GOLDEN_MODE: bit-exact
        run: python -m pytest tests/test_golden.py tests/test_task_snapshots.py tests/test_engine_version.py

  quality:
    name: Audit (coverage, contract, metamorphic, mutation, hand mutants)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . -r tools/ci/requirements-audit.txt
      - name: make audit
        run: make audit
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-report
          path: audit_report.json
          if-no-files-found: warn

  build:
    name: Wheel and sdist
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install "build==1.6.1" "twine==7.0.0" "check-wheel-contents==0.6.3"
          python -m build
      - name: Metadata, wheel contents, wheel against the tracked files
        run: |
          twine check --strict dist/*
          check-wheel-contents dist/*.whl
          python tools/audit/wheel_vs_git.py dist/*.whl

  fuzz:
    name: Nightly contract fuzz (random, 5000 examples)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . -r tools/ci/requirements-audit.txt
      - name: The contract machine, random
        env:
          HYPOTHESIS_PROFILE: nightly
        run: python -m pytest tests/test_contract_stateful.py -q
