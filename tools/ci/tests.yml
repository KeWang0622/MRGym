name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # a scan is single-threaded work; one thread also keeps the numbers the same from run to run
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff==0.17.6"
      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel
        run: |
          python -m pip install "build>=1.2"
          python -m build --wheel
      # The tests run against the installed wheel, never the working tree (src layout, no editable install).
      - name: Install the wheel
        run: python -m pip install dist/*.whl "pytest>=8"
      - name: Where the package comes from
        run: |
          python - <<'PY'
          import os, sys
          import mrgym, numpy, scipy
          print(mrgym.__file__)
          print("numpy", numpy.__version__, "scipy", scipy.__version__)
          here = os.path.realpath(os.getcwd()) + os.sep
          sys.exit(os.path.realpath(mrgym.__file__).startswith(here + "src" + os.sep))
          PY
      - name: Tests
        run: python -m pytest
      - name: Version
        run: mrgym --version
      - name: Environments
        run: mrgym list
      - name: One episode
        run: mrgym demo
      - name: Physics checks
        run: mrgym validate
      - name: Generated files are current
        run: python tools/generate.py --check
      - name: Results table matches the saved records
        run: mrgym results --check
